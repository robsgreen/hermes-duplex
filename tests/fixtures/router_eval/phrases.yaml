  - {text: use my portfolio agent, profile: _switch, active: general, effort: medium, target: stock-picker}
  - {text: can I talk to the investing agent, profile: _switch, active: general, effort: medium, target: stock-picker}
  - {text: connect me with the stock research assistant, profile: _switch, active: general, effort: medium, target: stock-picker}
  - {text: put me on the trading profile, profile: _switch, active: general, effort: medium, target: stock-picker}
  - {text: let me speak to the markets agent, profile: _switch, active: general, effort: medium, target: stock-picker}
