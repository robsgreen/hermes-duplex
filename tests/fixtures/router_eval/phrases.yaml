  - {text: how many miles is it to the moon, profile: general, active: stock-picker, effort: low}
  - {text: who wrote Pride and Prejudice, profile: general, active: general, effort: low}
  - {text: what's a good recipe for pancakes, profile: general, active: stock-picker, effort: medium}
  - {text: plan a weekend trip to Lisbon, profile: general, active: general, effort: high}
  - {text: explain how vaccines work, profile: general, active: stock-picker, effort: medium}
  - {text: what's on my calendar tomorrow, profile: general, active: general, effort: low}
  - {text: write a short poem for my wife's birthday, profile: general, active: stock-picker, effort: medium}
  - {text: summarize today's news, profile: general, active: general, effort: medium}
  # general: out of scope for every specialist profile.
  - {text: translate good morning into Spanish, profile: general, active: stock-picker, effort: low}
  - {text: how do I fix a leaky faucet, profile: general, active: general, effort: medium}
  - {text: what's the capital of Australia, profile: general, active: stock-picker, effort: low}
  - {text: help me write an email to my landlord, profile: general, active: general, effort: medium}
  - {text: compare three electric cars for a family of four, profile: general, active: stock-picker, effort: high}
  - {text: how long should I boil an egg, profile: general, active: general, effort: low}
  - {text: recommend a good sci-fi book, profile: general, active: stock-picker, effort: medium}
  - {text: what's the score of the Lakers game, profile: general, active: general, effort: low}
  # general: ASR-style noise.
  - {text: uh whats the whether like, profile: general, active: stock-picker, effort: low}
  - {text: remind me to uh call the dentist, profile: general, active: general, effort: low}
  - {text: tell me a jock, profile: general, active: stock-picker, effort: low}
  - {text: what time is it in tokio, profile: general, active: general, effort: low}
  - {text: set an alarm for seven a m, profile: general, active: stock-picker, effort: low}
  - {text: hey um is it going to snow, profile: general, active: general, effort: low}
  # general: follow-ups.
  - {text: and on Saturday, profile: general, active: stock-picker, effort: low, follows: will it rain this afternoon}
  - {text: make it twenty, profile: general, active: stock-picker, effort: low, follows: set a timer for ten minutes}
  - {text: another one, profile: general, active: general, effort: low, follows: tell me a joke about cats}
