  - {text: and in Paris, profile: general, active: stock-picker, effort: low, follows: what time is it in London}

  # _control: status.
  - {text: what's the status of my task, profile: _control, active: stock-picker, effort: medium, control_intent: status}
  - {text: are you still working on that, profile: _control, active: general, effort: medium, control_intent: status}
  - {text: is it done yet, profile: _control, active: stock-picker, effort: medium, control_intent: status}
  - {text: how far along are you, profile: _control, active: general, effort: medium, control_intent: status}
  - {text: what tasks are running, profile: _control, active: stock-picker, effort: medium, control_intent: status}
  - {text: any progress, profile: _control, active: general, effort: medium, control_intent: status}
  - {text: what are you doing right now, profile: _control, active: stock-picker, effort: medium, control_intent: status}
