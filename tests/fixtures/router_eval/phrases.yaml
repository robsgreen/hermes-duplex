  # _control: cancel.
  - {text: cancel it, profile: _control, active: stock-picker, effort: medium, control_intent: cancel}
  - {text: stop working on that, profile: _control, active: general, effort: medium, control_intent: cancel}
  - {text: never mind cancel the task, profile: _control, active: stock-picker, effort: medium, control_intent: cancel}
  - {text: forget about it, profile: _control, active: general, effort: medium, control_intent: cancel}
  - {text: abort the task, profile: _control, active: stock-picker, effort: medium, control_intent: cancel}
  - {text: stop that, profile: _control, active: general, effort: medium, control_intent: cancel}
  - {text: cancel the portfolio task, profile: _control, active: stock-picker, effort: medium, control_intent: cancel}
  - {text: uh cancel that, profile: _control, active: general, effort: medium, control_intent: cancel}
  - {text: nevermind, profile: _control, active: stock-picker, effort: medium, control_intent: cancel}
  - {text: stop the task, profile: _control, active: general, effort: medium, control_intent: cancel}
