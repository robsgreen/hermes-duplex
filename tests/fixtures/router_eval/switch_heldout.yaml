# Held-out switch phrasings: requests that ask to switch agents, and requests that only sound like it.
#
# The same format as phrases.yaml (see its header and hermes_duplex/router/eval.py). This file is
# never used to choose the switch-request parser's phrasings or the switch-target matcher's
# thresholds (TARGET_MIN_SIMILARITY, TARGET_MARGIN in hermes_duplex/router/knn.py); it only checks
# them. Its phrases come from review probes, written without looking at what the parser reads.
# `_switch` phrases ask to switch, with the profile they mean as `target` where they name one; every
# other phrase is a task and must never be taken as a switch request. The profiles are five, so a
# target has more to be confused with than in phrases.yaml. NAME_MIN_SIMILARITY (0.85) was set by
# the user's decision in review round 10b, not chosen from this file. The round-10b sections at the
# end say how their phrases were written.

profiles:
  general:
    description: General questions, weather, reminders, and anything else
    examples:
      - what's the weather like
      - set a reminder for nine
      - tell me a joke
  stock-picker:
    description: Portfolio, holdings, stock research, and trades
    aliases: [stocks]
    examples:
      - how's my portfolio
      - should I buy NVDA
      - what did TSLA do today
  news:
    description: Headlines, current events, and news briefings
    examples:
      - what's in the news
      - read me the headlines
  coder:
    description: Programming help, code review, and debugging
    examples:
      - why does my python script crash
      - review this pull request
  travel:
    description: Flights, hotels, trip planning, and itineraries
    examples:
      - find me a flight to Lisbon
      - book a hotel in Rome

